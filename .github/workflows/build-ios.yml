name: Build .NET MAUI iOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Pin .NET SDK explicitly to .NET 8
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Automatically restore all required workloads for your .csproj
      - name: Restore Workloads
        run: dotnet workload restore Parichko/Parichko.csproj

      # 4. Restore Dependencies
      - name: Restore Dependencies
        run: dotnet restore Parichko/Parichko.csproj

      # 5. Build ONLY for iOS target framework
      - name: Build MAUI iOS App
        run: |
          dotnet publish Parichko/Parichko.csproj \
            -f net8.0-ios \
            -c Release \
            -p:ArchiveOnBuild=false \
            -p:CodesignProvision=false \
            -p:BuildIpa=true \
            -p:RuntimeIdentifier=ios-arm64

      # 6. Upload output artifact to GitHub
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-build
          path: '**/bin/Release/net8.0-ios/ios-arm64/publish/*.ipa'