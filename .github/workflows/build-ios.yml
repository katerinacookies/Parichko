name: Build .NET MAUI iOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup .NET 8 and force it via global.json
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          global-json-file: 'global.json'

      # 3. Install MAUI workload for .NET 8
      - name: Install MAUI Workload
        run: dotnet workload install maui

      # 4. Restore Dependencies
      - name: Restore Dependencies
        run: |
          dotnet restore Parichko/Parichko.csproj \
            -p:CheckEolTargetFramework=false

      # 5. Build and Publish iOS App
      - name: Build MAUI iOS App
        run: |
          dotnet publish Parichko/Parichko.csproj \
            -f net8.0-ios \
            -c Release \
            -p:CheckEolTargetFramework=false \
            -p:ArchiveOnBuild=false \
            -p:CodesignProvision=false \
            -p:BuildIpa=true \
            -p:RuntimeIdentifier=ios-arm64

      # 6. Upload output artifact to GitHub
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-build
          path: '**/bin/Release/net8.0-ios/ios-arm64/publish/*.ipa'